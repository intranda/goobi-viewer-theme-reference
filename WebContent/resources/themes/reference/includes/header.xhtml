<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <header
        id="header"
        class="header #{userBean.admin ? '-adminActive' : ''}">
        <div class="header__bar">
            <!-- LOGO, THE ONLY START PAGE LINK -->
            <a
                class="header__logo"
                href="#{request.contextPath}/"
                aria-label="#{msg.home}"
                aria-current="#{navigationHelper.currentPage eq 'index' ? 'page' : null}">
                <viewerComponent:themeLogo
                    defaultUrl="/images/template/goobi_logo.svg"
                    darkDefaultUrl="/images/template/goobi_logo_dark.png"
                    width="300"
                    height="150"
                    alt="#{adminThemesBean.getThemeLabel(configurationBean.name)} Logo" />
            </a>

            <!-- ENTRY POINTS, FIRST THREE CMS MENU ITEMS -->
            <nav
                class="header__nav"
                aria-label="#{msg.reference__header_navigation}">
                <ui:repeat
                    var="navItem"
                    varStatus="navStatus"
                    value="#{cmsBean.navigationMenuItems}">
                    <ui:fragment rendered="#{navStatus.index lt 3 and navItem.valid and navItem.shouldDisplay}">
                        <span class="header__nav-item">
                            <!-- WITHOUT SUBMENU -->
                            <ui:fragment rendered="#{navItem.activeChildItems.isEmpty()}">
                                <viewerComponent:navigationLink
                                    navItem="#{navItem}"
                                    linkClass="header__nav-link" />
                            </ui:fragment>

                            <!-- WITH SUBMENU, CHILDREN IN A POPOVER -->
                            <ui:fragment rendered="#{!navItem.activeChildItems.isEmpty()}">
                                <button
                                    type="button"
                                    id="headerNavToggle#{navStatus.index}"
                                    class="header__nav-link header__nav-toggle"
                                    popovertarget="headerNavPanel#{navStatus.index}"
                                    aria-controls="headerNavPanel#{navStatus.index}"
                                    aria-expanded="false">
                                    <span>#{msg[navItem.itemLabel]}</span>
                                    <util:icon icon="chevron-down" />
                                </button>
                                <div
                                    id="headerNavPanel#{navStatus.index}"
                                    class="header__panel header__nav-panel"
                                    data-align="start"
                                    popover="auto"
                                    aria-labelledby="headerNavToggle#{navStatus.index}">
                                    <ui:repeat
                                        var="childItem"
                                        varStatus="childStatus"
                                        value="#{navItem.activeChildItems}">
                                        <ui:fragment
                                            rendered="#{childItem.valid and childItem.shouldDisplay and childItem.activeChildItems.isEmpty()}">
                                            <viewerComponent:navigationLink
                                                navItem="#{childItem}"
                                                linkClass="header__nav-panel-link" />
                                        </ui:fragment>

                                        <!-- GROUP, LABELLED SECTION WITHOUT LINK (DEEPER LEVELS IN THE DRAWER) -->
                                        <ui:fragment
                                            rendered="#{childItem.valid and childItem.shouldDisplay and !childItem.activeChildItems.isEmpty()}">
                                            <div
                                                class="header__nav-panel-group"
                                                role="group"
                                                aria-labelledby="headerNavGroup#{navStatus.index}_#{childStatus.index}">
                                                <span
                                                    id="headerNavGroup#{navStatus.index}_#{childStatus.index}"
                                                    class="header__nav-panel-group-title">
                                                    #{msg[childItem.itemLabel]}
                                                </span>
                                                <ui:repeat
                                                    var="leafItem"
                                                    value="#{childItem.activeChildItems}">
                                                    <ui:fragment
                                                        rendered="#{leafItem.valid and leafItem.shouldDisplay}">
                                                        <viewerComponent:navigationLink
                                                            navItem="#{leafItem}"
                                                            linkClass="header__nav-panel-link" />
                                                    </ui:fragment>
                                                </ui:repeat>
                                            </div>
                                        </ui:fragment>
                                    </ui:repeat>
                                </div>
                            </ui:fragment>
                        </span>
                    </ui:fragment>
                </ui:repeat>
            </nav>

            <!-- SEARCH PANEL -->
            <div
                id="headerSearchPanel"
                class="header__search"
                hidden="hidden">
                <div class="header__search-inner">
                    <widgetComponent:widget_searchField
                        id="headerSearch"
                        htmlId="headerSearchField"
                        onlySearchIcon="true" />
                </div>
            </div>
            <div class="header__actions">
                <button
                    type="button"
                    class="header__icon-button"
                    data-toggle="header-search"
                    data-search-label="#{msg.search}"
                    data-close-label="#{msg.close}"
                    aria-controls="headerSearchPanel"
                    aria-expanded="false"
                    aria-label="#{msg.search}"
                    title="#{msg.search}"
                    aria-keyshortcuts="Meta+K Control+K">
                    <span class="header__search-open-icon"><util:icon icon="search" /></span>
                    <span class="header__search-close-icon"><util:icon icon="x" /></span>
                </button>
                <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
                    <ui:fragment rendered="#{!userBean.loggedIn}">
                        <button
                            type="button"
                            class="header__icon-button"
                            popovertarget="headerBookmarksPanel"
                            data-header-bookmarks="true"
                            data-bookmark-label="#{msg.bookmarkList}"
                            hidden="hidden"
                            aria-controls="headerBookmarksPanel"
                            aria-expanded="false"
                            aria-label="#{msg.bookmarkList}"
                            title="#{msg.bookmarkList}">
                            <util:icon icon="bookmark" />
                            <span
                                class="header__bookmark-count"
                                data-header-bookmark-count="true"
                                aria-hidden="true" />
                        </button>
                    </ui:fragment>
                </ui:fragment>
                <button
                    type="button"
                    data-open="menu"
                    aria-controls="headerMenu"
                    aria-expanded="false"
                    aria-haspopup="dialog"
                    aria-label="#{msg.aria_label__open_navigation}"
                    title="#{msg.reference__drawer_menu}"
                    class="header__icon-button header__menu-toggle">
                    <util:icon icon="menu-2" />
                </button>

                <!-- ACCOUNT -->
                <div
                    class="header__account header__menu-anchor"
                    data-account-label="#{userBean.loggedIn ? msg.login__custom_name += ': ' += userBean.user.displayName : msg.userNotLoggedIn}">
                    <viewerComponent:loginNavigation />
                    <ui:fragment rendered="#{userBean.loggedIn}">
                        <template id="headerAccountIdentity">
                            <div class="header__account-identity">
                                <img
                                    src="#{userBean.user.getAvatarUrl(80)}"
                                    data-user-avatar="true"
                                    alt=""
                                    width="40"
                                    height="40" />
                                <span title="#{userBean.user.displayName}">#{userBean.user.displayName}</span>
                            </div>
                        </template>
                    </ui:fragment>
                </div>
            </div>
        </div>

        <!-- BOOKMARKS PANEL -->
        <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
            <section
                id="headerBookmarksPanel"
                class="header__panel header__bookmarks"
                popover="auto"
                aria-labelledby="headerBookmarksTitle">
                <div class="header__panel-head">
                    <h2
                        id="headerBookmarksTitle"
                        class="header__panel-title">
                        #{msg.bookmarkList}
                    </h2>
                    <button
                        type="button"
                        class="header__icon-button"
                        popovertarget="headerBookmarksPanel"
                        popovertargetaction="hide"
                        aria-label="#{msg.close}">
                        <util:icon icon="x" />
                    </button>
                </div>
                <p class="header__bookmark-empty">#{msg.bookmarkList_noEntryWarning}</p>
                <div class="header__bookmark-content">
                    <!-- BOOKMARKS MOUNT POINT, USED BY CORE -->
                    <span
                        class="header__bookmark-hook"
                        data-bookmark-list-type="dropdown"
                        aria-hidden="true" />
                </div>
            </section>
        </ui:fragment>

        <!-- DRAWER, NATIVE MODAL DIALOG -->
        <dialog
            id="headerMenu"
            class="drawer"
            aria-labelledby="headerMenuTitle">
            <div class="drawer__head">
                <h2
                    id="headerMenuTitle"
                    class="drawer__title">
                    #{msg.reference__drawer_menu}
                </h2>
                <button
                    type="button"
                    class="drawer__close"
                    data-close="menu"
                    aria-label="#{msg.aria_label__close_navigation}">
                    <util:icon icon="x" />
                </button>
            </div>
            <div class="drawer__body">
                <div class="drawer__navigation">
                    <viewerComponent:navigation
                        id="pageNavigationMobile"
                        megaMenu="false" />
                </div>

                <!-- PREFERENCES -->
                <div class="drawer__preferences">
                    <h:form
                        id="headerAppearance"
                        prependId="false">
                        <section class="drawer__appearance">
                            <h3
                                id="headerAppearanceTitle"
                                class="drawer__section-title">
                                #{msg.reference__color_scheme}
                            </h3>
                            <div
                                class="drawer__segments"
                                role="group"
                                aria-labelledby="headerAppearanceTitle">
                                <button
                                    type="button"
                                    jsf:id="appearanceLight"
                                    class="drawer__segment"
                                    data-color-mode="color-theme-light"
                                    aria-label="#{msg.reference__color_light}"
                                    title="#{msg.button__theme_color_switch_light}"
                                    aria-pressed="#{sessionBean.get('colorTheme') eq 'color-theme-light'}"
                                    jsf:actionListener="#{sessionBean.put('colorTheme', 'color-theme-light')}">
                                    <span>#{msg.reference__color_light}</span>
                                    <f:ajax render="@none" />
                                </button>
                                <button
                                    type="button"
                                    jsf:id="appearanceDark"
                                    class="drawer__segment"
                                    data-color-mode="color-theme-dark"
                                    aria-label="#{msg.reference__color_dark}"
                                    title="#{msg.button__theme_color_switch_dark}"
                                    aria-pressed="#{sessionBean.get('colorTheme') eq 'color-theme-dark'}"
                                    jsf:actionListener="#{sessionBean.put('colorTheme', 'color-theme-dark')}">
                                    <span>#{msg.reference__color_dark}</span>
                                    <f:ajax render="@none" />
                                </button>
                                <button
                                    type="button"
                                    jsf:id="appearanceSystem"
                                    class="drawer__segment"
                                    data-color-mode=""
                                    aria-label="#{msg.reference__color_system}"
                                    title="#{msg.cms_widgets__type_automatic}"
                                    aria-pressed="#{sessionBean.get('colorTheme') ne 'color-theme-light' and sessionBean.get('colorTheme') ne 'color-theme-dark'}"
                                    jsf:actionListener="#{sessionBean.put('colorTheme', '')}">
                                    <span>#{msg.reference__color_system}</span>
                                    <f:ajax render="@none" />
                                </button>
                            </div>
                        </section>
                    </h:form>
                    <ui:fragment rendered="#{fn:length(navigationHelper.supportedLanguages) > 1}">
                        <details class="drawer__language">
                            <summary class="drawer__language-toggle">
                                <span>#{msg.language}</span>
                                <span
                                    class="drawer__language-current"
                                    lang="#{navigationHelper.localeString}">
                                    #{msg['changeLocal_long_' += navigationHelper.localeString]}
                                </span>
                                <util:icon icon="chevron-down" />
                            </summary>
                            <viewerComponent:changeLocal
                                displayAll="true"
                                toggleLanguage="false"
                                longLanguageStrings="true" />
                        </details>
                    </ui:fragment>
                    <ui:fragment rendered="#{adminClientsBean.clientLoggedIn}">
                        <viewerComponent:clientApplicationStatus />
                    </ui:fragment>
                </div>
            </div>
        </dialog>
        <script>
            var referenceAccount = document.querySelector('.header__account');
            var referenceAccountToggle = referenceAccount.querySelector('.login-navigation__toggle-button');
            if (referenceAccountToggle) {
                referenceAccountToggle.setAttribute('aria-label', referenceAccount.dataset.accountLabel);
            }

            // Disable all transitions while the color mode class changes, so that
            // every element switches at once instead of fading at different speeds.
            function referenceWithoutTransitions(change) {
                var style = document.createElement('style');
                style.textContent = '*, *::before, *::after { transition: none !important; }';
                document.head.appendChild(style);
                change();
                // Force a style recalculation while transitions are still disabled
                void document.documentElement.offsetHeight;
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        style.remove();
                    });
                });
            }

            // Apply the color mode immediately on click. The JSF ajax request on the button
            // only stores the choice in the session in the background (render="@none").
            document.addEventListener('click', function (event) {
                var button = event.target.closest('.drawer__segment[data-color-mode]');
                if (!button) return;
                var mode = button.dataset.colorMode;
                referenceWithoutTransitions(function () {
                    document.documentElement.classList.remove('color-theme-light', 'color-theme-dark');
                    if (mode) document.documentElement.classList.add(mode);
                });
                button.parentElement.querySelectorAll('.drawer__segment').forEach(function (segment) {
                    segment.setAttribute('aria-pressed', String(segment === button));
                });
            });
        </script>
    </header>
</ui:composition>
