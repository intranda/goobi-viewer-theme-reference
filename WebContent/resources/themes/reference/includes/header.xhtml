<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    xmlns:templateComponent="http://xmlns.jcp.org/jsf/composite/themes/reference/components">
    <header
        id="header"
        class="header #{userBean.admin ? '-adminActive' : ''}">
        <div class="header__bar">
            <a
                class="header__logo"
                href="#{request.contextPath}/">
                <img
                    src='#{adminThemesBean.getLogo("/images/template/goobi_logo.svg", 300, 150)}'
                    alt="#{adminThemesBean.getThemeLabel(configurationBean.name)} Logo" />
            </a>

            <div class="header__search-box">
                <widgetComponent:widget_searchField
                    id="headerSearch"
                    htmlId="headerSearchField"
                    onlySearchIcon="true" />
                <kbd
                    class="header__search-shortcut"
                    aria-hidden="true">
                    ⌘ K
                </kbd>
            </div>

            <!-- Only the first three configured entries are shown in this row.
                 The drawer below always renders the complete CMS navigation. -->
            <div
                id="pageNavigation"
                class="header__primary-navigation">
                <viewerComponent:navigation
                    id="header__nav-menu-desktop"
                    megaMenu="false" />
            </div>

            <div class="header__actions">
                <div class="header__actions-color-switch">
                    <viewerComponent:colorThemeToggle />
                </div>
                <ui:fragment rendered="#{fn:length(navigationHelper.supportedLanguages) > 1}">
                    <div
                        id="changeLocalWrapper"
                        class="header__actions-language">
                        <button
                            type="button"
                            class="btn btn--clean header__icon-button"
                            data-toggle="local"
                            aria-controls="changeLocal"
                            aria-expanded="false"
                            aria-label="#{msg.aria_label__switch_language}">
                            <util:icon icon="world" />
                        </button>
                        <viewerComponent:changeLocal
                            toggleLanguage="true"
                            longLanguageStrings="true" />
                    </div>
                </ui:fragment>
                <button
                    type="button"
                    data-open="menu"
                    aria-controls="headerMenu"
                    aria-expanded="false"
                    aria-label="#{msg.aria_label__open_navigation}"
                    data-label-open="#{msg.aria_label__open_navigation}"
                    data-label-close="#{msg.close}"
                    class="header__icon-button header__menu-toggle">
                    <util:icon icon="menu-2" />
                </button>
            </div>
        </div>

        <div
            class="header__navigation-mobile-background"
            aria-hidden="true"></div>
        <div
            id="headerMenu"
            class="page-navigation__mobile"
            inert="inert"
            aria-hidden="true">
            <div class="header__menu-heading">
                <span>#{msg.aria_label__nav_main}</span>
                <button
                    type="button"
                    class="btn btn--clean header__icon-button"
                    data-close="menu"
                    aria-label="#{msg.close}">
                    <util:icon icon="x" />
                </button>
            </div>
            <viewerComponent:navigation
                id="pageNavigationMobile"
                megaMenu="false" />
            <div class="header__menu-account">
                <div class="header__actions-bookmark"><viewerComponent:bookmarkListNavigation /></div>
                <div class="header__actions-login"><viewerComponent:loginNavigation /></div>
                <ui:fragment rendered="#{adminClientsBean.clientLoggedIn}">
                    <div class="header__client-status"><viewerComponent:clientApplicationStatus /></div>
                </ui:fragment>
            </div>
        </div>
    </header>
</ui:composition>
