<!DOCTYPE html [ <!ENTITY copy "&#169;">
<!ENTITY times "&#215;">
<!ENTITY nbsp "&#160;">
]>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    lang="#{navigationHelper.localeString}"
    dir="#{navigationHelper.localeString eq 'ar' or navigationHelper.localeString eq 'iw' ? 'rtl' : 'ltr'}"
    class="#{sessionBean.get('colorTheme')}">
    <!-- TEMPLATE NAME, SELECTS THE CSS AND JS LIBRARIES -->
    <c:set
        var="templateName"
        value="templateImmersive" />

    <!-- EXCLUDED LIBRARIES BY NAME -->
    <c:set
        var="excludeCSS"
        value="#{[]}" />
    <c:set
        var="excludeJS"
        value="#{[]}" />

    <!-- HEAD -->
    <h:head profile="http://dublincore.org/documents/dcq-html/">
        <ui:insert name="head" />
        <title>
            <h:outputText value="#{activeDocumentBean.titleBarLabel} - " rendered="#{activeDocumentBean.titleBarLabel !=
            null}" />#{adminThemesBean.getThemeLabel(configurationBean.name)}
        </title>

        <!-- META TAGS -->
        <ui:include src="/resources/includes/templateHeads/metaTags.xhtml" />
        <meta
            name="color-scheme"
            content="light dark" />

        <!-- FAVICON -->
        <link
            rel="shortcut icon"
            href='#{adminThemesBean.getIcon("images/template/favicon.ico", 32, 32)}' />

        <!-- TWITTER CARD / OPENGRAPH -->
        <ui:include src="/resources/includes/embed/twittercard.xhtml" />
        <ui:include src="/resources/includes/embed/opengraph.xhtml" />

        <!-- RELATIVE URL TAGS -->
        <h:outputText
            escape="false"
            value="#{activeDocumentBean.relativeUrlTags}" />

        <!-- OPENSEARCH -->
        <link
            rel="search"
            type="application/opensearchdescription+xml"
            title="#{adminThemesBean.getThemeLabel(configurationBean.name)}"
            href="#{request.contextPath}/api/v1/opensearch/" />

        <!-- OEMBED -->
        <ui:fragment rendered="#{activeDocumentBean.recordLoaded}">
            <link
                rel="alternate"
                type="application/json+oembed"
                href="#{navigationHelper.applicationUrl}oembed?url=#{navigationHelper.encodedUrl}&amp;format=json"
                title="Goobi viewer oEmbed Profile" />
        </ui:fragment>

        <!-- CSS -->
        <ui:include src="/resources/includes/templateHeads/css.xhtml">
            <ui:param
                name="templateName"
                value="#{templateName}" />
            <ui:param
                name="excludeCSS"
                value="#{excludeCSS}" />
            <ui:param
                name="cacheBuster"
                value="cachetimestamp=2026-9-19-16-22-53" />
        </ui:include>

        <!-- SUBTHEME CSS -->
        <h:panelGroup
            rendered="#{navigationHelper.subthemeSelected and navigationHelper.subThemeDiscriminatorValue!='-'}">
            <link
                type="text/css"
                rel="stylesheet"
                href="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/css/dist/#{navigationHelper.subThemeDiscriminatorValue}.min.css?${navigationHelper.buildVersion}" />
        </h:panelGroup>

        <!-- QUICK CSS, INCLUDE KEEPS IDE VALIDATION -->
        <ui:fragment rendered="#{adminThemesBean.stylesheetExists(adminThemesBean.mainThemeName)}">
            <ui:include src="/resources/includes/templateHeads/quickcss.xhtml">
                <ui:param
                    name="style"
                    value="#{adminThemesBean.getStylesheet(adminThemesBean.mainThemeName)}"></ui:param>
            </ui:include>
        </ui:fragment>

        <!-- QUICK CSS FROM SUBTHEMES -->
        <ui:fragment rendered="#{adminThemesBean.stylesheetExists(adminThemesBean.currentSubThemeName)}">
            <ui:include src="/resources/includes/templateHeads/quickcss.xhtml">
                <ui:param
                    name="style"
                    value="#{adminThemesBean.getStylesheet(adminThemesBean.currentSubThemeName)}"></ui:param>
            </ui:include>
        </ui:fragment>

        <!-- JAVASCRIPT -->
        <ui:include src="/resources/includes/templateHeads/js.xhtml">
            <ui:param
                name="templateName"
                value="#{templateName}" />
            <ui:param
                name="excludeJS"
                value="#{excludeJS}" />
            <ui:param
                name="cacheBuster"
                value="cachetimestamp=2026-9-19-16-22-53" />
        </ui:include>

        <!-- QUICK JS, INCLUDE KEEPS IDE VALIDATION -->
        <ui:fragment rendered="#{adminThemesBean.javascriptExists(adminThemesBean.mainThemeName)}">
            <ui:include src="/resources/includes/templateHeads/quickjs.xhtml">
                <ui:param
                    name="script"
                    value="#{adminThemesBean.getJavascript(adminThemesBean.mainThemeName)}"></ui:param>
            </ui:include>
        </ui:fragment>

        <!-- QUICK JS FROM SUBTHEMES -->
        <ui:fragment rendered="#{adminThemesBean.javascriptExists(adminThemesBean.currentSubThemeName)}">
            <ui:include src="/resources/includes/templateHeads/quickjs.xhtml">
                <ui:param
                    name="script"
                    value="#{adminThemesBean.getJavascript(adminThemesBean.currentSubThemeName)}"></ui:param>
            </ui:include>
        </ui:fragment>
    </h:head>

    <!-- METADATA -->
    <ui:insert name="metadata" />

    <!-- BODY -->
    <h:body id="immersiveView">
        <h:panelGroup
            id="subBody"
            layout="block">
            <f:view locale="#{navigationHelper.locale}">
                <!-- TOP ANCHOR FOR SCROLLING TO TOP -->
                <span
                    id="top"
                    tabindex="-1"></span>

                <!-- COINS (CONTEXTOBJECTS IN SPANS) -->
                <span
                    class="Z3988"
                    title="#{activeDocumentBean.viewManager.contextObject}"></span>

                <!-- MESSAGES -->
                <div class="messages">
                    <h:messages
                        id="messages"
                        infoClass="alert alert-success"
                        errorClass="alert alert-danger" />
                </div>

                <!-- MAINTENANCE INFO -->
                <ui:include src="/resources/includes/maintenanceMode.xhtml" />

                <!-- BODY WRAPPER -->
                <div id="bodyWrapper">
                    <!-- ADMIN TOPBAR FRONTEND -->
                    <viewerComponent:frontEndAdminTopBar />

                    <!-- ONLY FOR KEYBOARD - SKIP TO MAIN CONTENT LINK -->
                    <div
                        id="skipmenu"
                        class="skip-menu">
                        <a
                            href="#main"
                            class="skip-menu__link">
                            #{msg.a11y__skip_menu__jump_to_main}
                        </a>
                    </div>

                    <!-- HEADER -->
                    <ui:include src="includes/header.xhtml" />

                    <!-- MOBILE OVERLAY -->
                    <div class="mobile-overlay"></div>

                    <!-- SEARCH OVERLAY -->
                    <div
                        data-target="search-overlay"
                        class="header__search-overlay"></div>

                    <!-- NO BREADCRUMB, THE VIEWER HAS ITS OWN BACK LINK -->
                    <!-- MAIN, FULL-BLEED -->
                    <main
                        id="main"
                        class="content__main"
                        role="main"
                        tabindex="-1">
                        <ui:insert name="content-immersive" />
                    </main>

                    <!-- FOOTER -->
                    <ui:include src="includes/footer.xhtml" />
                </div>

                <!-- GENERIC OVERLAY -->
                <ui:include src="/resources/includes/overlay.xhtml" />

                <!-- FULL OVERLAY LOADING SCREEN (DISPLAYED WHILE REDIRECTING PAGES) -->
                <ui:include src="/resources/includes/loadingOverlay.xhtml" />

                <!-- USER LOGIN + TERMS + FEEDBACK -->
                <viewerComponent:modalUserLogin id="userLoginModal" />
                <viewerComponent:modalUserTerms id="userTermsModal" />
                <viewerComponent:modalFeedbackForm id="feedbackModal" />
                <ui:fragment rendered="#{configurationBean.contentUploadEnabled}">
                    <viewerComponent:modalContentUpload id="contentUploadModal" />
                </ui:fragment>

                <!-- CUSTOM JAVASCRIPT -->
                <ui:include src="includes/customJS.xhtml" />
            </f:view>

            <!-- COOKIE BANNER -->
            <ui:include src="/resources/includes/cookieBanner.xhtml" />

            <!-- PIWIK -->
            <ui:fragment rendered="#{configurationBean.piwikTrackingEnabled}">
                <viewerComponent:piwikTracking
                    piwikBaseURL="#{configurationBean.piwikBaseURL}"
                    piwikSiteID="#{configurationBean.piwikSiteID}" />
            </ui:fragment>
        </h:panelGroup>
    </h:body>
</html>
